<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book an appointment</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    color: #111827;
    background: #ffffff;
  }
  #smb-widget {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-width: 300px;
  }
  #smb-header {
    padding: 12px 16px;
    border-bottom: 1px solid #e5e7eb;
    flex: 0 0 auto;
  }
  #smb-header h1 {
    font-size: 17px;
    margin: 0;
  }
  #smb-header h1:focus {
    outline: none;
  }
  #smb-status {
    padding: 0 16px;
    font-size: 13px;
    color: #4b5563;
    min-height: 0;
  }
  #smb-error {
    margin: 8px 16px 0;
    padding: 8px 12px;
    background: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
    border-radius: 8px;
    font-size: 14px;
  }
  #smb-error[hidden] { display: none; }
  #smb-step {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px 16px 16px;
  }
  #smb-step h2 {
    font-size: 15px;
    margin: 0 0 10px;
  }
  #smb-step h2:focus {
    outline: none;
  }
  .smb-back {
    background: none;
    border: none;
    color: #2563eb;
    font-size: 14px;
    padding: 8px 0;
    cursor: pointer;
    min-height: 44px;
  }
  .smb-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .smb-item-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    min-height: 44px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .smb-item-btn:hover { background: #f9fafb; }
  .smb-item-btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
  .smb-day-list {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .smb-day-btn {
    flex: 0 0 auto;
    min-width: 56px;
    min-height: 44px;
    padding: 8px 10px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: #fff;
    font-size: 13px;
    text-align: center;
    cursor: pointer;
  }
  .smb-day-btn[aria-pressed="true"] {
    background: #111827;
    color: #fff;
    border-color: #111827;
  }
  .smb-slot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 8px;
  }
  .smb-slot-btn {
    min-height: 44px;
    padding: 8px 6px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .smb-slot-btn:hover { background: #f9fafb; }
  .smb-field {
    margin-bottom: 12px;
  }
  .smb-field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .smb-field input,
  .smb-field textarea {
    width: 100%;
    padding: 10px;
    min-height: 44px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
    font-family: inherit;
  }
  .smb-field textarea {
    min-height: 72px;
    resize: vertical;
  }
  .smb-summary {
    background: #f3f4f6;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .smb-primary-btn {
    width: 100%;
    min-height: 46px;
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    background: #111827;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .smb-primary-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .smb-link-btn {
    background: none;
    border: none;
    color: #2563eb;
    font-size: 15px;
    padding: 8px 0;
    cursor: pointer;
    text-decoration: underline;
    min-height: 44px;
  }
</style>
</head>
<body>
<script type="module" src="./main.js"></script>
</body>
</html>
