openapi: 3.0.3
info:
  title: SMB Booking API
  version: 1.0.0
servers:
  # Placeholder only. The API rewrites servers[0].url when it serves
  # /openapi.json -- to PUBLIC_API_BASE when set, otherwise to the origin
  # the request arrived on -- so a deployed instance advertises itself.
  - url: https://api.example.com
paths:
  /v1/services:
    get:
      summary: List services
      description: >
        Real services backed by Postgres/in-memory (see
        migrations/003_create_services.sql). accountId is required --
        there's no admin auth in front of this endpoint yet, so a bare
        request without it is rejected rather than dumping every
        account's services.
      parameters:
        - in: query
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
        '400':
          description: accountId query parameter is missing
    post:
      summary: Create a service (admin)
      description: >
        Operator endpoint, guarded by a shared admin key
        (`X-Admin-Key` must equal the ADMIN_API_KEY environment
        variable) rather than the agent HMAC. When ADMIN_API_KEY is
        unset the endpoint is not available at all and answers 503,
        which is deliberately distinguishable from a wrong key (401).
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, name, durationMinutes]
              properties:
                id:
                  type: string
                  description: >
                    Optional. Lets an operator seed a stable, known id;
                    one is generated when omitted.
                accountId: { type: string }
                name: { type: string }
                durationMinutes: { type: integer, minimum: 1 }
                bufferMinutes: { type: integer, minimum: 0, default: 0 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Validation error
        '401':
          description: Missing or incorrect X-Admin-Key
        '503':
          description: ADMIN_API_KEY is not configured on this instance
  /v1/availability:
    get:
      summary: Get availability
      description: >
        Returns `{ slots: [] }` unless at least accountId, start and end
        are supplied.


        With `provider` and `calendarId` set as well, it queries the
        connected calendar (via the Python connectors) for real busy
        intervals and computes free slots; accountId must have that
        provider's calendar already connected via
        `/oauth/{provider}/start` + `/oauth/{provider}/callback`.


        Without `provider`, it falls back to the instance's configured
        business hours (BUSINESS_HOURS, default "Mon-Fri 09:00-17:00",
        interpreted in BUSINESS_TZ, default "America/New_York") minus the
        account's existing non-canceled appointments. Slots never start in
        the past.


        When serviceId is supplied it must name a real service (see
        GET /v1/services) belonging to accountId (404/400 otherwise), and
        its durationMinutes + bufferMinutes -- not slotMinutes --
        determine the slot length, on either path.
      parameters:
        - in: query
          name: accountId
          schema: { type: string }
        - in: query
          name: serviceId
          schema: { type: string }
        - in: query
          name: provider
          schema: { type: string, enum: [google, microsoft] }
        - in: query
          name: calendarId
          schema: { type: string }
        - in: query
          name: start
          schema: { type: string, format: date-time }
        - in: query
          name: end
          schema: { type: string, format: date-time }
        - in: query
          name: slotMinutes
          schema: { type: integer, default: 30 }
        - in: query
          name: tz
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        start: { type: string, format: date-time }
                        end: { type: string, format: date-time }
        '400':
          description: Unsupported provider, or accountId has no calendar connected for provider
        '502':
          description: Failed to reach the calendar provider
  /v1/appointments:
    post:
      summary: Create appointment
      security:
        - hmac: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '200':
          description: >
            Replayed an existing appointment for this Idempotency-Key
            (no new calendar event or DB row was created).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Validation error, unsupported provider, or accountId has no calendar connected for provider
        '409':
          description: >
            The requested window overlaps an existing non-canceled
            appointment for this account (`slot no longer available`), or
            a busy interval on the connected calendar.
        '502':
          description: Failed to reach the calendar provider
  /v1/public/appointments:
    post:
      summary: Create appointment (public / browser)
      description: >
        Unauthenticated booking endpoint for the embeddable browser
        widget. A page running on a customer's site can't hold the agent
        HMAC secret, so no X-Signature is required here; the per-IP rate
        limiter applies instead.


        `Idempotency-Key` is optional (one is generated server-side when
        absent); supplying one gives the same replay semantics as the
        signed route. `provider`, `calendarId` and `durationMinutes` in
        the body are ignored -- the appointment's length always comes
        from the named service, which must exist and belong to accountId.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAppointmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '200':
          description: Replayed an existing appointment for this Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Validation error
        '404':
          description: Unknown serviceId, or a serviceId that doesn't belong to accountId
        '409':
          description: >
            The requested window overlaps an existing non-canceled
            appointment for this account (`slot no longer available`).
        '429':
          description: Rate limit exceeded
  /oauth/{provider}/start:
    get:
      summary: Begin the OAuth authorization-code flow for a calendar provider
      description: 302-redirects the browser to the provider's consent screen.
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [google, microsoft] }
        - in: query
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the provider's authorization URL
        '400':
          description: Missing accountId
        '404':
          description: Unsupported provider
  /oauth/{provider}/callback:
    get:
      summary: OAuth callback -- exchanges the authorization code for tokens
      description: >
        The provider redirects here with `code` and `state` after the
        user consents. Tokens are exchanged and stored encrypted
        (AES-256-GCM, key from TOKEN_ENCRYPTION_KEY) in Postgres, keyed
        by (accountId, provider).
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [google, microsoft] }
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
      responses:
        '200':
          description: Calendar connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId: { type: string }
                  provider: { type: string }
                  connected: { type: boolean }
                  expiresAt: { type: string, format: date-time }
        '400':
          description: Missing/invalid code or state
        '404':
          description: Unsupported provider
        '502':
          description: Token exchange with the provider failed
  /v1/appointments/{id}/cancel:
    post:
      summary: Cancel appointment
      security:
        - hmac: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
  /v1/appointments/{id}/reschedule:
    post:
      summary: Reschedule appointment
      security:
        - hmac: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newStartTime: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
components:
  securitySchemes:
    hmac:
      type: apiKey
      in: header
      name: X-Signature
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
  schemas:
    Service:
      type: object
      properties:
        id: { type: string }
        accountId: { type: string }
        name: { type: string }
        durationMinutes: { type: integer }
        bufferMinutes: { type: integer }
    AppointmentRequest:
      type: object
      required: [accountId, serviceId, startTime, customer]
      properties:
        accountId: { type: string }
        serviceId: { type: string }
        startTime: { type: string, format: date-time }
        customer:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
        notes: { type: string }
        source: { type: string, enum: [human, agent, api] }
        metadata: { type: object, additionalProperties: true }
        provider:
          type: string
          enum: [google, microsoft]
          description: >
            When set, the appointment is checked against and written to
            the connected calendar (accountId must already be connected
            via /oauth/{provider}/start). calendarId becomes required.
        calendarId: { type: string }
        durationMinutes:
          type: integer
          default: 30
          description: >
            Fallback only, kept for packages/adapters/mcp: used when
            serviceId doesn't name a real service. When the service
            exists, its own durationMinutes wins.
    PublicAppointmentRequest:
      type: object
      required: [accountId, serviceId, startTime, customer]
      properties:
        accountId: { type: string }
        serviceId: { type: string }
        startTime: { type: string, format: date-time }
        customer:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
        notes: { type: string }
    AppointmentResponse:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [requested, tentative, confirmed, canceled, no_show] }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        provider_event_id: { type: string }
        links:
          type: object
          properties:
            ical: { type: string, format: uri }
            manage: { type: string, format: uri }
