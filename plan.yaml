version: 1.0
title: AI-Native Chat + Agent-Ready Scheduling for SMBs
meta:
  goal: >
    Deliver a human-friendly chat/booking widget AND an agent-discoverable scheduling API
    that connects to each SMB’s existing calendar (Google/Microsoft first; ICS read-only fallback).
    One-click WordPress install, JSON-LD discovery, OpenAPI endpoints, OAuth, and an agent-friendly DOM fallback.
  roles:
    - { id: PM,  name: Product Manager }
    - { id: BE,  name: Backend Engineer }
    - { id: FE,  name: Frontend/Web Widget Engineer }
    - { id: WP,  name: WordPress Plugin Engineer }
    - { id: SEC, name: Security/Infra }
    - { id: DS,  name: Data/Analytics }
    - { id: DX,  name: DevRel/Docs }
  enums:
    status: [todo, partial, done, blocked, n/a]
    priority: [P0, P1, P2]
  notes:
    - Start cheap with gpt-5-nano; escalate on low-confidence only.
    - Calendar writes require OAuth or hosted calendar; ICS is read-only.
    - "2026-09-08 reality check: `pnpm -r build` fails out of the box (packages/api's
       tsc run pulls in packages/discovery/well_known.ts, which imports 'express' --
       a dependency only installed under packages/api). The /v1/services and
       /v1/availability endpoints return hardcoded empty responses; /v1/appointments
       only writes to an in-memory Map. Full findings, exact commands, and output:
       docs/REALITY-CHECK.md."
    - "2026-09-08 later session: `pnpm -r build` now passes (discovery no longer
       needs express). /v1/appointments (+ cancel/reschedule) now read/write real
       Postgres (in-memory kept as a test double). packages/adapters/mcp and
       packages/widget went from zero tests to smoke tests -- the widget one found
       and fixed a real bug where dist/loader.js couldn't run as the classic
       <script> tag it's actually loaded as. /v1/services and /v1/availability
       are still stubs; still no OAuth flow. See docs/REALITY-CHECK.md's update
       note and the newest tmp/wrapups/*.yaml."
architecture:
  components:
    - { id: api, desc: Booking API + availability + OpenAPI }
    - { id: connectors, desc: Google, Microsoft, ICS }
    - { id: discovery, desc: JSON-LD + well-known endpoints }
    - { id: widget, desc: Web widget loader + UI }
    - { id: wp_plugin, desc: WordPress wrapper (inject + OAuth UI) }
    - { id: adapters, desc: MCP server + A2A placeholder }
    - { id: security, desc: HMAC, rate limits, secrets, PII }
    - { id: observability, desc: logs, metrics, SLOs }
    - { id: ops, desc: CI/CD, migrations, rollbacks }
phases:
  - id: P0
    name: Discovery & Specs
    status: done
    tasks:
      - { id: P0-1, title: MVP definition + non-goals, owner: PM, status: done }
      - { id: P0-2, title: Data model & lifecycle, owner: BE, status: done }
      - { id: P0-3, title: OpenAPI first draft, owner: BE, status: done }
      - { id: P0-4, title: Security baseline, owner: SEC, status: done }
  - id: P1
    name: Core API + DB + Booking Logic
    status: partial
    tasks:
      - { id: P1-1, title: Repo bootstrap + healthcheck, owner: BE, status: done }
      - { id: P1-2, title: Availability engine + DST tests, owner: BE, status: done }
      - { id: P1-3, title: Booking engine idempotent, owner: BE, status: done, note: "Appointments now persist to Postgres (packages/api/src/repositories/pg-appointments-repo.ts, migrations/001_create_appointments.sql); idempotency is a unique constraint on idempotency_key, not an in-process Map, so it's correct across restarts. In-memory repo kept as a fast test double. Redis is still provisioned but unused -- not needed by anything implemented so far. Verified against the real compose Postgres, see docs/REALITY-CHECK.md's update note and the newest tmp/wrapups/*.yaml." }
      - { id: P1-4, title: Notification service, owner: BE, status: done }
  - id: P2
    name: Calendar Connectors
    status: partial
    tasks:
      - { id: P2-1, title: Google OAuth read/write, owner: BE, status: partial, note: "Calendar API read/write calls exist and are unit-tested (see connectors-py tests), but there is no OAuth authorization-code flow anywhere in the repo -- functions take a pre-obtained bearer token as an argument. GOOGLE_CLIENT_ID/SECRET in .env.example are unused." }
      - { id: P2-2, title: Microsoft Graph read/write, owner: BE, status: partial, note: "Same gap as P2-1: Graph API calls implemented and tested, but no OAuth flow to obtain the token. MS_CLIENT_ID/SECRET in .env.example are unused." }
      - { id: P2-3, title: ICS read-only + confirm workflow, owner: BE, status: partial, note: "ICS parsing/busy-block merge is implemented and tested (test_ics_busy.py, test_merge_busy_*.py). No 'confirm workflow' exists anywhere in the codebase." }
  - id: P3
    name: Discovery Layer
    status: done
    tasks:
      - { id: P3-1, title: JSON-LD generator, owner: BE, status: done }
      - { id: P3-2, title: Injection (client + WP server), owner: FE, status: done }
      - { id: P3-3, title: Well-known endpoints, owner: BE, status: done }
  - id: P4
    name: Widget (human + agent-friendly)
    status: done
    tasks:
      - { id: P4-1, title: Loader script (async + CSP), owner: FE, status: done }
      - { id: P4-2, title: Chat + booking UI, owner: FE, status: done }
      - { id: P4-3, title: "Agent DOM mode (?agent=1)", owner: FE, status: done }
  - id: P5
    name: WordPress plugin
    status: done
    tasks:
      - { id: P5-1, title: Plugin skeleton + settings, owner: WP, status: done }
      - { id: P5-2, title: Script + JSON-LD injection, owner: WP, status: done }
      - { id: P5-3, title: OAuth UI (Google/MS), owner: WP, status: done }
  - id: P6
    name: Agent adapters
    status: done
    tasks:
      - { id: P6-1, title: MCP tool server (list/create/cancel), owner: BE, status: done }
  - id: P7
    name: Testing Infrastructure & Bug Fixes
    status: done
    tasks:
      - { id: P7-1, title: WordPress Docker testing environment, owner: WP, status: done }
      - { id: P7-2, title: Fix TypeScript adapter generator compilation, owner: BE, status: done, note: "Real bug was the npm script hardcoding --manifest (doubled when invoked as documented, so the manifest path was never read) and the generator never parsing manifest YAML at all. Fixed tools/adapter-gen/index.ts to parse the manifest and inject real values; added yaml as a root devDependency. Verified: node --test tools/adapter-gen/test/generate.test.mjs." }
      - { id: P7-3, title: Enable plugin volume mount in docker-compose, owner: WP, status: done, note: "Mount was already syntactically correct (added Aug 2025) but had never been run against a real Docker daemon. Verified live: docker compose -f platforms/wordpress-plugin/docker-compose.test.yml up -d, confirmed generated files appear inside the container at wp-content/plugins/ai-smb-booker." }
      - { id: P7-4, title: End-to-end WordPress plugin testing, owner: WP, status: done, note: "Automated: generate -> zip -> php -l on every file (node --test tools/adapter-gen/test/generate.test.mjs). Manual real-environment check: wp core install, wp plugin activate ai-smb-booker -> success, no debug.log errors, JSON-LD + widget script both render on the front end, clean deactivate/reactivate. Full transcript in docs/REALITY-CHECK.md. Does not cover: real OAuth connect flow in the admin page, or a hosted (non-placeholder) widget script URL -- those are separate, larger work items." }
definitions_of_done:
  mvp:
    - "WP plugin installs; script + JSON-LD present"
    - "Google OAuth read/write; ICS fallback works"
    - "OpenAPI accurate; sample agent can book end-to-end"
    - "Widget a11y AA; keyboard-only OK"
